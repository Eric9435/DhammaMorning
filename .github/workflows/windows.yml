name: Dhamma Morning Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows app dependencies
        run: python -m pip install -r windows/requirements.txt pyinstaller
      - name: Validate syntax and stop modes
        run: |
          python -m py_compile windows/app.py windows/playback_logic.py
          python -m unittest discover -s windows -p 'test_*.py' -v
      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DhammaMorning windows/app.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhammaMorning-Windows-EXE
          path: dist/DhammaMorning.exe
          if-no-files-found: error
